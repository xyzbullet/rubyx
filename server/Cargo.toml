[package]
name = "wraith-server"
version = "0.9.2"
edition = "2021"
description = "High-concurrency wisp tunnel node: WebSocket stream multiplexing, SOCKS5 egress, Tor bridge, on-node DNS."
license = "MIT"

[[bin]]
name = "wraith-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
hickory-resolver = "0.24"
dashmap = "6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# e2e transport encryption (pure rust — no openssl)
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# L7 fetch mode: node-side TLS termination
rustls = "0.23"
rustls-pki-types = "1"
tokio-rustls = "0.26"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
